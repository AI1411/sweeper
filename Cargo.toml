[package]
name = "sweeper"
version = "0.1.0"
edition = "2021"
description = "Sweep unwanted processes away"
license = "MIT"

[[bin]]
name = "sw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "5"
nix = { version = "0.29", features = ["signal", "process"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "serde"] }

[dev-dependencies]
tempfile = "3"
